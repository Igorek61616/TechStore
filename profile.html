<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Профиль — TechStore</title>

    <link rel="stylesheet" href="style.css?v=20">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <main class="profile-page">

        <section class="profile-card">

            <a href="index.html" class="auth-logo">
                TechStore
            </a>

            <h1>Личный кабинет</h1>

            <div class="profile-info">

                <p>
                    <strong>Имя:</strong>
                    <span id="profile-name">—</span>
                </p>

                <p>
                    <strong>Электронная почта:</strong>
                    <span id="profile-email">—</span>
                </p>

            </div>

            <h2>История заказов</h2>

            <div id="profile-orders" class="profile-orders">
                Заказов пока нет
            </div>

            <button type="button" id="logout-button" class="logout-button">
                Выйти из аккаунта
            </button>

            <a href="index.html" class="back-home">
                ← Вернуться на главную
            </a>

        </section>

    </main>

    <script src="script.js?v=20"></script>

    <footer class="footer">
    <div class="footer-content">
        <h3>TechStore</h3>
        <p>Учебный проект интернет-магазина</p>

        <p class="footer-copy">
            © 2026 TechStore. Все права защищены.
        </p>
    </div>
</footer>

</body>

</html>
