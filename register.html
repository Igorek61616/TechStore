<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Регистрация — TechStore</title>

    <link rel="stylesheet" href="style.css?v=20">
    <link rel="icon" href="favicon.png" type="image/png">
</head>

<body>

    <main class="auth-page">

        <section class="auth-card">

            <a href="index.html" class="auth-logo">
                TechStore
            </a>

            <h1>Регистрация</h1>

            <p class="auth-description">
              Создайте аккаунт
                </p>

            <form id="register-form">

    <label for="register-name">
        Имя
    </label>

    <input
        type="text"
        id="register-name"
        placeholder="Введите имя"
        required
    >

    <label for="register-email">
        Электронная почта
    </label>

    <input
        type="email"
        id="register-email"
        placeholder="example@mail.ru"
        required
    >

    <label for="register-password">
        Пароль
    </label>

    <input
        type="password"
        id="register-password"
        placeholder="Минимум 6 символов"
        minlength="6"
        required
    >

    <label for="register-password-repeat">
        Повторите пароль
    </label>

    <input
        type="password"
        id="register-password-repeat"
        placeholder="Введите пароль ещё раз"
        minlength="6"
        required
    >

    <p class="auth-error" id="register-error"></p>

    <button type="submit" class="auth-button">
        Зарегистрироваться
    </button>

</form>

            <p class="auth-switch">
    Уже есть аккаунт?
    <a href="login.html">
        Войти
    </a>
</p>

        </section>

    </main>

    <script src="script.js?v=20"></script>

    <footer class="footer">
    <div class="footer-content">
        <h3>TechStore</h3>
        <p>Учебный проект интернет-магазина</p>

        <p class="footer-copy">
            © 2026 TechStore. Все права защищены.
        </p>
    </div>
</footer>

</body>

</html>
